<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>couleur aleatoire</title>
    <style>
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            font-family: Arial, sans-serif;
            font-size: 20px;
            gap: 30px;
            background: #f0f2f5;
        }

        a {
            text-decoration: none;
            color: #f7df1e;
            font-size: 24px;
            transition: color 0.25s ease;
            filter: drop-shadow(0 0 10px #f7df1e);
            transition: all 0.25s ease;
        }

        a:hover {
            color: #d4be13; 
            filter: drop-shadow(0 0 10px #d4be13);
            font-size:26px ;
        }

        button {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            background: linear-gradient(135deg, #1e1e2f, #2c2c54);
            color: #fff;
            font-size: 18px;
            cursor: pointer;
            box-shadow: 0 8px 20px rgba(0,0,0,0.25);
            transition: all 0.25s ease;
        }

        
        button:hover {
            transform: scale(1.05);
            color: #f7df1e;
            background: linear-gradient(135deg, #2c2c54, #1e1e2f);
        }
        div.contenaire {
            border: none;
            border-radius: 8px;
            padding: 15px 20px;
            gap: 10px;
            background:linear-gradient(-135deg, #1e1e2f, #34346c);

        }
        div.contenaire2 {
            margin-bottom: 20px;
            display: flex;
            justify-content: center;
            border: none;   
            border-radius: 8px;
            padding: 15px 20px;
            gap: 10px;

        }

    </style>
</head>
<body>
    <div class="contenaire">
        <div class="contenaire2">
    <a href="exercices.html">Retour</a>
    </div>
    <button>bouton changeur de couleur</button>
    <script>
        button = document.querySelector("button");
    function getRandomColor() {
    
    let randomColor = Math.floor(Math.random() * 16777215).toString(16);
    
    
    return "#" + randomColor.padStart(6, "0");
}

    button.addEventListener("click", function(click){
        document.body.style.backgroundColor = getRandomColor();
    });

</script></div>
</body>
</html>
