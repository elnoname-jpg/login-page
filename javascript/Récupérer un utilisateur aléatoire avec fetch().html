<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Récupérer un utilisateur aléatoire avec fetch()</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
            background-color: #f9f9f9;
        }

        h1 {
            color: #333;
        }

        button {
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
        }

        #userInfo {
            margin-top: 20px;
            font-weight: bold;
            color: #555;
        }
    </style>
</head>
<body>
    <a href="exercices.html">Retour</a>
    <h1>Récupérer un utilisateur aléatoire avec fetch()</h1>

    <button id="fetchUserBtn">Récupérer un utilisateur aléatoire</button>
    <div id="userInfo" style="margin-top:20px;"></div>

    <script>
        document.getElementById('fetchUserBtn').addEventListener('click', function() {
            fetch('https://randomuser.me/api/')
                .then(response => response.json())
                .then(data => {
                    const user = data.results[0];
                    const userInfoDiv = document.getElementById('userInfo');
                    userInfoDiv.innerHTML = `
                        <p><strong>Nom:</strong> ${user.name.first} ${user.name.last}</p>
                        <p><strong>Email:</strong> ${user.email}</p>
                        <img src="${user.picture.medium}" alt="Photo de l'utilisateur">
                    `;
                })
                .catch(error => {
                    console.error('Erreur lors de la récupération de l\'utilisateur:', error);
                });
        });
    </script>
</body>
</html>
