<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Menu Burger Responsive</title>
  <style>
    :root {
      --bg: #0f172a;
      --fg: #f8fafc;
      --accent: #38bdf8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      background: #f1f5f9;
      color: #0f172a;
    }

    header {
      background: var(--bg);
      color: var(--fg);
      padding: 16px 20px;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      max-width: 1100px;
      margin: 0 auto;
    }

    .logo {
      font-weight: 700;
      letter-spacing: 0.5px;
    }

    /* Menu desktop */
    .menu {
      display: flex;
      gap: 20px;
      list-style: none;
    }

    .menu a {
      color: var(--fg);
      text-decoration: none;
      font-weight: 500;
    }

    .menu a:hover {
      color: var(--accent);
    }

    /* Burger */
    .burger {
      display: none;
      background: transparent;
      border: 0;
      cursor: pointer;
      width: 40px;
      height: 40px;
    }

    .burger span {
      display: block;
      width: 26px;
      height: 2px;
      background: var(--fg);
      margin: 6px auto;
      transition: transform 0.3s ease, opacity 0.3s ease;
    }

    /* Mobile */
    @media (max-width: 768px) {
      .burger { display: block; }

      .menu {
        position: fixed;
        top: 64px;
        right: 0;
        background: var(--bg);
        width: 220px;
        height: calc(100vh - 64px);
        flex-direction: column;
        align-items: flex-start;
        padding: 20px;
        transform: translateX(100%);
        transition: transform 0.3s ease;
      }

      /* Classe togglée */
      .menu.is-open {
        transform: translateX(0%);
      }
    }

    /* Animation burger en croix */
    .burger.is-open span:nth-child(1) {
      transform: translateY(8px) rotate(45deg);
    }
    .burger.is-open span:nth-child(2) {
      opacity: 0;
    }
    .burger.is-open span:nth-child(3) {
      transform: translateY(-8px) rotate(-45deg);
    }

    main {
      max-width: 1100px;
      margin: 40px auto;
      padding: 0 20px;
    }
  </style>
</head>
<body>
  <header>
    <nav class="nav">
      <div class="logo">MonSite</div>

      <ul class="menu" id="menu">
        <li><a href="#accueil">Accueil</a></li>
        <li><a href="#services">Services</a></li>
        <li><a href="#projets">Projets</a></li>
        <li><a href="#contact">Contact</a></li>
      </ul>

      <button class="burger" id="burger" aria-label="Ouvrir le menu" aria-expanded="false">
        <span></span><span></span><span></span>
      </button>
    </nav>
  </header>

  <main>
    <h1>Menu burger responsive</h1>
    <p>Redimensionnez la fenêtre pour voir le menu mobile.</p>
  </main>

  <script>
    const burger = document.getElementById('burger');
    const menu = document.getElementById('menu');

    burger.addEventListener('click', () => {
      const isOpen = menu.classList.toggle('is-open');
      burger.classList.toggle('is-open', isOpen);
      burger.setAttribute('aria-expanded', isOpen);
    });

    // (optionnel) Fermer le menu au clic sur un lien
    menu.querySelectorAll('a').forEach(link => {
      link.addEventListener('click', () => {
        menu.classList.remove('is-open');
        burger.classList.remove('is-open');
        burger.setAttribute('aria-expanded', 'false');
      });
    });
  </script>
</body>
</html>
