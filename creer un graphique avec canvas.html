<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>creer un graphique avec canvas</title>
    <style>
        body {
            margin: 150PX;
        }
        a {
            display: block;
            margin-top: 20px;
            font-size: 18px;
            font-family: arial, sans-serif;
        }
        </style>
</head>
<body>
    <canvas width="500" height="350" style="  box-shadow: 0px 0px 50px 15px rgba(0,0,0,0.2);"></canvas>
     <a href="exercices.html">retour</a>
   

    <script>
       const canvas = document.querySelector("canvas");
       const ctx = canvas.getContext("2d");
         ctx.fillStyle = "lightblue";
            ctx.fillRect(50, 150, 50, 200);
            ctx.fillStyle = "lightblue";
            ctx.fillRect(150, 100, 50, 250);
            ctx.fillStyle = "lightblue";
            ctx.fillRect(250, 50, 50, 300);
            ctx.fillStyle = "lightblue";
            ctx.fillRect(350, 200, 50, 150);




  
    </script>  
</body>
