<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>modifier text paragraphe</title>
    <style>
        div {
            display: flex;
            font-size: 20px;
            
            gap: 20px;
            justify-content: center;
            border: solid 2px black;
            border-radius: 8px;
            padding: 20px ;
            flex-direction: column;
        }
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-top: 300px;
            font-size: 20px;
            gap: 20px; 
        }

    </style>
</head>
<body>
    <strong><a href="exercices.html">retour</a></strong>
    <div>
    <p>text pas modifier</p>
    <button class="bouton changeur de text"> bouton changeur de text</button>
    <script>
document.getElementsByClassName("bouton changeur de text")[0].addEventListener("click", function() {
    document.querySelector("p").innerText = "text modifié";
});

    </script></div>
</body>
</html>
