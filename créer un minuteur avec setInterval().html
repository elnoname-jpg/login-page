<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>minuteur</title>
    <style>
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            font-size: 20px;
            gap:20px;
            font-family: Arial, sans-serif;
        }
        a{
            display: flex;
           margin-bottom: 100px;
           justify-content: center;
           font-family: arial, sans-serif;
        }
        #minuteur {
            font-size: 50px;
            font-weight: bold;
        }


    </style>
</head>
<body>
    <a href="exercices.html">retour</a>
    bouton start <button id="bouton start">Start</button>
    <div id="minuteur">0</div>
   <script> 
        let seconde = 0;
        let interval = null;

        document.getElementById("bouton start").addEventListener("click", function() {
            if (interval === null) {
                interval = setInterval(function() {
                    seconde++;
                    document.getElementById("minuteur").textContent = seconde;
                }, 1000);
            }
        });
   </script> 
</body>
</html>
