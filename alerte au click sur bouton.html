<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>alert au click sur bouton</title>
    <style>.bouton {
        display: flex; 
        justify-content: center;
        border: 1px solid #ccc;
            border-radius: 5px;
            padding: 15px;
            gap: 10px;    
            box-shadow: 0px 0px 25px 10px rgba(0,0,0,0.1);
            
            border-color: #646464;
            background-color: #f9f9f9;
            font-family: Arial, sans-serif;
       
        
        
    } 
    body {
        display: flex;
        flex-direction: column;
        align-items: center;
        margin-top: 300px;
        font-size: 20px;
        gap: 20px;
        font-family: Arial, sans-serif;


            
            

        
    }

    </style>
</head>
<body>
    <strong><a href="exercices.html">retour</a></strong>
    <div class="bouton">
    <button id="bouton1">bouton ID</button>
    <button class="bouton2">bouton Classe</button>
    </div>
    <script>
        document.getElementById("bouton1").addEventListener("click", function() {
            alert("bouton cliqué avec l'ID");});
        document.getElementsByClassName("bouton2")[0].addEventListener("click", function() {alert("bouton cliqué avec la classe")});
    </script>
    
</body>
</html>
