<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>alert au click sur bouton</title>
    <style>
  
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            font-family: Arial, sans-serif;
            font-size: 20px;
            gap: 30px;
            background: #f0f2f5;
        }

       
        strong a {
            text-decoration: none;
            color: #333;
            font-size: 24px;
            transition: color 0.25s ease;
        }

        strong a:hover {
            color: #f7df1e; 
        }

        
        .bouton {
            display: flex; 
            justify-content: center;
            gap: 20px;
        }

    
        button {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            background: linear-gradient(135deg, #1e1e2f, #2c2c54);
            color: #fff;
            font-size: 18px;
            cursor: pointer;
            box-shadow: 0 8px 20px rgba(0,0,0,0.25);
            transition: all 0.25s ease;
        }

        
        button:hover {
            transform: scale(1.05);
            box-shadow: 0 12px 25px rgba(0,0,0,0.35);
            background: linear-gradient(135deg, #2c2c54, #1e1e2f);
        }

        
        .bouton2 {
            background: linear-gradient(135deg, #f7df1e, #ffc107);
            color: #000;
        }

        .bouton2:hover {
            background: linear-gradient(135deg, #ffc107, #f7df1e);
            color: #000;
        }
    </style>
</head>
<body>

    <strong><a href="exercices.html">← Retour</a></strong>

    <div class="bouton">
        <button id="bouton1">Bouton ID</button>
        <button class="bouton2">Bouton Classe</button>
    </div>

    <script>
        document.getElementById("bouton1").addEventListener("click", function() {
            alert("Bouton cliqué avec l'ID");
        });

        document.getElementsByClassName("bouton2")[0].addEventListener("click", function() {
            alert("Bouton cliqué avec la classe");
        });
    </script>
    
</body>
</html>
