    <style>
        body {

            justify-content: center;

        .lien_exercices {

            color: #f7df1e;

        }

        .header img {
            width: 90px;
            filter: drop-shadow(0 0 20px rgba(255, 225, 0, 0.836));
        }

        .lien_exercices a {
            text-decoration: none;
            color: #ffffff;
            background: rgba(255, 255, 255, 0.08);
            padding: 10px 14px;
            border-radius: 8px;
            
            transition: all 0.25s ease;
            
        }

        .lien_exercices a:hover {
            background: #f7df1e;
            color: #000;
            transform:rotate(1deg) scale(1.10);
        }

</head>
