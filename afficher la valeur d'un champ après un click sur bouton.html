<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>afficher la valeur d'un champ après un click sur bouton</title>
    <style>
        body {
           display: flex;
            flex-direction: column;
            align-items: center;
            margin-top: 300px;
            font-size: 20px;
            gap: 20px; 
        }
        div {
            display: flex; 
        justify-content: center;
        border: none;
            border-radius: 8px;
            padding: 15px 20px;
            gap: 10px;    
            box-shadow: 0px 0px 25px 10px rgba(0,0,0,0.1);
            background:linear-gradient(-135deg, #1e1e2f, #34346c);
            font-family: Arial, sans-serif;
            color: white;
        }
        a {
            text-decoration: none;
            color: #333;
            font-size: 24px;
            filter: drop-shadow(0 0 10px black);
            transition: color 0.25s ease;
            font-family: arial, sans-serif;
        }
        a:hover {
            color: #f7df1e; 
            filter: drop-shadow(0 0 10px #f7df1e);
        }
        button {
            border: none;
            font-size: 24px;
            border-radius: 8px;
            color: black;
            padding: 10px 20px;
            background:linear-gradient(#f7df1e, #eece00);
            filter: drop-shadow(0 0 10px #f7df1e);
            cursor: pointer;
            transition: all 0.25s ease;
        }
        button:hover {
           background:linear-gradient(#edcd00, #f7df1e);
              transform: scale(1.02);
            
        }
        input {
            font-size: 18px;
            padding: 8px;
            border-radius: 8px;
            border: none;
            background: rgba(255, 255, 255, 0.08);
            color: white;
            box-shadow: 0 0 10px black;
            appearance: none;
            -webkit-appearance: none;
            -moz-appearance: none;
        }
        input:focus {
            outline: none;
            
        }
    </style>
</head>
<body>
    <strong><a href="exercices.html">Retour</a></strong>
    <div> 
    <input type="text" id="champinput" placeholder="entrez une valeur">
        <button>afficher la valeur</button>


    <script>
      document.querySelector("button").addEventListener("click", function() {  
        let valeurduChamp = document.getElementById("champinput").value;
        document.querySelector("p").innerText ="la valeur du champ est:" + valeurduChamp;

      }) 
    </script>
<p></p>
</div> 
</body>
</html>
