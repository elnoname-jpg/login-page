<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>afficher la valeur d'un champ après un click sur bouton</title>
    <style>
        body {
           display: flex;
            flex-direction: column;
            align-items: center;
            margin-top: 300px;
            font-size: 20px;
            gap: 20px; 
        }
        div {
            display: flex; 
        justify-content: center;
        border: 1px solid #ccc;
            border-radius: 5px;
            padding: 15px;
            gap: 10px;    
            box-shadow: 0px 0px 25px 10px rgba(0,0,0,0.1);
            
            border-color: #646464;
            background-color: #f9f9f9;
            font-family: Arial, sans-serif;
        }

    </style>
</head>
<body>
    <strong><a href="exercices.html">retour</a></strong>
    <div> 
    <input type="text" id="champinput" placeholder="entrez une valeur">
        <button>afficher la valeur</button>


    <script>
      document.querySelector("button").addEventListener("click", function() {  
        let valeurduChamp = document.getElementById("champinput").value;
        document.querySelector("p").innerText ="la valeur du champ est:" + valeurduChamp;

      }) 
    </script>
<p></p>
</div> 
</body>
</html>
