<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dark mode par checkbox</title>
    <style>
        body {
          transition: background-color 0.5s, color 0.5s;
        }

        .dark-mode {
            background-color: #2c2c2c;
            color: white;
        }
        input[type="checkbox"] {
            width: 20px;
            height: 20px;
        }
        label {
            font-size: 20px;
            margin-left: 10px;
        }
        a {
            display: block;
            margin-bottom: 20px;
            font-size: 18px;
            font-family: arial, sans-serif;
        }
        input, label {
            font-family: arial, sans-serif;
        }
    </style>
</head>

<body>
    <a href="exercices.html">retour</a>
    <input type="checkbox" id="le mode dark" onclick="darkmode()">
    <label for="le mode dark">Dark Mode</label>
    <script>
        function darkmode() {
            document.body.classList.toggle("dark-mode");
        }
        
        
        </script>
</body>
</html>
